[project]
name = "emulator"
version = "0.1.0"
description = "Headless Balatro simulator for reinforcement learning research"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Burhan Sancakli"},{name = "Said"},{name = "Aagat"},{name = "Ayxan"},{name = "Shamama"}]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100",
    "gymnasium>=1.0",
    "httpx>=0.28.1",
    "lupa>=2.6",
    "numpy>=1.24",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "requests>=2.28",
    "rich>=13.0",
    "ruff>=0.15.6",
    "sb3-contrib>=2.3",
    "setuptools<82",
    "stable-baselines3[extra]>=2.3",
    "tensorboard>=2.14",
    "torch>=2.0",
    "tqdm>=4.64",
    "uvicorn[standard]>=0.23",
    "websockets>=11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emulator*"]

[project.scripts]
emulator = "emulator.cli.main:main"

[project.urls]
Repository = "https://github.com/Deaglesso/balatro-ai"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "-m", "not benchmark and not live"]
markers = [
    "benchmark: performance benchmarks (deselect with -m 'not benchmark')",
    "live: requires a running balatrobot instance (deselect with -m 'not live')",
    "slow: tests that take >10s (run with -m slow or include via -m 'not benchmark and not live')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
